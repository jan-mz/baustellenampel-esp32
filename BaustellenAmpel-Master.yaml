substitutions:
  # ROLLE: 1 = Master | 2 = Master-Slave (folgt Master) | 3 = Slave (Gegenseite)
  #
  # esphome run .\BaustellenAmpel-Master.yaml
  #
  ampel_rolle: "1" 
  device_name: "baustellenampel-rolle${ampel_rolle}"

esphome:
  name: ${device_name}
  on_boot:
    priority: -10
    then:
      - espnow.set_channel: 1
      - delay: 1000ms
      - logger.log: "Starte Testlauf...(1/4)"
      - script.execute: led_testlauf
      - delay: 1500ms
      - logger.log: "Starte Testlauf...(2/4)"
      - script.execute: led_testlauf
      - delay: 1500ms
      - logger.log: "Starte Testlauf...(3/4)"
      - script.execute: led_testlauf
      - delay: 1500ms
      - logger.log: "Starte Testlauf...(4/4)"
      - script.execute: led_testlauf
      - delay: 1500ms
      - logger.log: "Testlauf beendet."
      - script.execute: update_zeit_datensatz
      - script.execute: haupt_zyklus

logger:
  level: DEBUG

binary_sensor:
  - platform: gpio
    pin:
      number: GPIO19
      mode: INPUT_PULLUP
      inverted: true
    id: datensatz_pin1
    internal: true
    filters:
      - delayed_on: 30ms
      - delayed_off: 30ms
    on_state:
      then:
        - script.execute: update_zeit_datensatz

  - platform: gpio
    pin:
      number: GPIO18
      mode: INPUT_PULLUP
      inverted: true
    id: datensatz_pin2
    internal: true
    filters:
      - delayed_on: 30ms
      - delayed_off: 30ms
    on_state:
      then:
        - script.execute: update_zeit_datensatz

esp32:
  board: esp32dev
  framework:
    type: arduino

globals:
  - id: dataset_selected
    type: int
    initial_value: '2'

  - id: gruen_zeit_ds1
    type: int
    initial_value: '5'
  - id: raeum_zeit_ds1
    type: int
    initial_value: '20'

  - id: gruen_zeit_ds2
    type: int
    initial_value: '10'
  - id: raeum_zeit_ds2
    type: int
    initial_value: '20'

  - id: gruen_zeit_ds3
    type: int
    initial_value: '20'
  - id: raeum_zeit_ds3
    type: int
    initial_value: '30'

factory_reset:
  resets_required: 2

espnow:
  channel: 1
  auto_add_peer: true

number:
  - platform: template
    name: "Gruenphase Dauer"
    id: zeit_gruen
    initial_value: 30
    min_value: 5
    max_value: 120
    step: 1
    optimistic: true
    unit_of_measurement: "s"
  - platform: template
    name: "Raeumphase Dauer"
    id: zeit_raeum
    initial_value: 15
    min_value: 10
    max_value: 300
    step: 1
    optimistic: true
    unit_of_measurement: "s"

output:
  - platform: ledc
    pin: GPIO 23
    id: led_ampel_lokal_rot
  - platform: ledc
    pin: GPIO 22
    id: led_ampel_lokal_gelb
  - platform: ledc
    pin: GPIO 21
    id: led_ampel_lokal_gruen
  - platform: ledc
    pin: GPIO 5
    id: led_info_dataset1
  - platform: ledc
    pin: GPIO 16
    id: led_info_dataset2
  - platform: ledc
    pin: GPIO 17
    id: led_info_dataset3

script:
  - id: licht_aus
    then:
      - output.turn_off: led_ampel_lokal_rot
      - output.turn_off: led_ampel_lokal_gelb
      - output.turn_off: led_ampel_lokal_gruen

  - id: led_testlauf
    then:
      - output.turn_off: led_ampel_lokal_rot
      - output.turn_off: led_ampel_lokal_gelb
      - output.turn_off: led_ampel_lokal_gruen
      - output.turn_off: led_info_dataset1
      - output.turn_off: led_info_dataset2  
      - output.turn_off: led_info_dataset3

      - output.turn_on: led_ampel_lokal_rot
      - output.turn_on: led_info_dataset3
      - delay: 300ms

      - output.turn_off: led_ampel_lokal_rot
      - output.turn_off: led_info_dataset3
      - output.turn_on: led_ampel_lokal_gelb
      - output.turn_on: led_info_dataset2
      - delay: 300ms

      - output.turn_off: led_ampel_lokal_gelb
      - output.turn_off: led_info_dataset2
      - output.turn_on: led_ampel_lokal_gruen
      - output.turn_on: led_info_dataset1
      - delay: 300ms

      - output.turn_off: led_ampel_lokal_rot
      - output.turn_off: led_ampel_lokal_gelb
      - output.turn_off: led_ampel_lokal_gruen
      - output.turn_off: led_info_dataset1
      - output.turn_off: led_info_dataset2
      - output.turn_off: led_info_dataset3

  - id: setze_licht
    parameters:
      phase: int
    then:
      - script.execute: licht_aus
      - lambda: |-
          if (phase == 0) { id(led_ampel_lokal_rot).set_level(1.0); }      
          else if (phase == 1) { id(led_ampel_lokal_rot).set_level(1.0); id(led_ampel_lokal_gelb).set_level(1.0); } 
          else if (phase == 2) { id(led_ampel_lokal_gruen).set_level(1.0); } 
          else if (phase == 3) { id(led_ampel_lokal_gelb).set_level(1.0); }

  - id: update_zeit_datensatz
    then:
      - lambda: |-
          bool pin1 = id(datensatz_pin1).state;
          bool pin2 = id(datensatz_pin2).state;
          int new_dataset = 2;
          if (pin1) {
            new_dataset = 1;
          } else if (pin2) {
            new_dataset = 3;
          }
          int current_dataset = id(dataset_selected);
          if (new_dataset == current_dataset) {
            return;
          }
          id(dataset_selected) = new_dataset;
          int new_gruen = id(gruen_zeit_ds2);
          int new_raeum = id(raeum_zeit_ds2);
          if (new_dataset == 1) {
            new_gruen = id(gruen_zeit_ds1);
            new_raeum = id(raeum_zeit_ds1);
          } else if (new_dataset == 3) {
            new_gruen = id(gruen_zeit_ds3);
            new_raeum = id(raeum_zeit_ds3);
          }
          id(zeit_gruen).publish_state(new_gruen);
          id(zeit_raeum).publish_state(new_raeum);
          id(led_info_dataset1).set_level(new_dataset == 1 ? 0.01 : 0.0);
          id(led_info_dataset2).set_level(new_dataset == 2 ? 0.01 : 0.0);
          id(led_info_dataset3).set_level(new_dataset == 3 ? 0.01 : 0.0);
          ESP_LOGD("main", "Zeiten-Datensatz %d ausgewählt: Grün-Dauer=%ds Räumzeit=%ds", new_dataset, new_gruen, new_raeum);

  - id: haupt_zyklus
    mode: restart
    then:
      - while:
          condition:
            lambda: 'return true;'
          then:
            # --- SEITE A (Master & Master-Slave) ---
            - logger.log: "Master: Rot-Gelb"
            - script.execute: { id: setze_licht, phase: 1 } 
            - espnow.broadcast: [1, 1]
            - delay: 3s

            - logger.log: "Master: Grün"
            - script.execute: { id: setze_licht, phase: 2 } 
            - espnow.broadcast: [1, 2]
            - delay: !lambda "return id(zeit_gruen).state * 1000;"

            - logger.log: "Master: Gelb"
            - script.execute: { id: setze_licht, phase: 3 } 
            - espnow.broadcast: [1, 3]
            - delay: 3s

            - logger.log: "Master: Rot"
            - script.execute: { id: setze_licht, phase: 0 } 
            - espnow.broadcast: [1, 0]
            
            # --- RÄUMPHASE ---
            - logger.log: "Räumphase: (Alle Rot)"
            - delay: !lambda "return id(zeit_raeum).state * 1000;"
            
            # --- SEITE B (Slaves) ---
            - logger.log: "Slave: Rot-Gelb"
            - espnow.broadcast: [2, 1] 
            - delay: 3s

            - logger.log: "Slave: Grün"
            - espnow.broadcast: [2, 2] 
            - delay: !lambda "return id(zeit_gruen).state * 1000;"

            - logger.log: "Slave: Gelb"
            - espnow.broadcast: [2, 3] 
            - delay: 3s
            - espnow.broadcast: [2, 0] 
            
            # --- RÄUMPHASE ---
            - logger.log: "Räumphase: (Alle Rot)"
            - delay: !lambda "return id(zeit_raeum).state * 1000;"